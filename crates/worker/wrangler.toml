# The Suhina bot's Worker. Deploy from this folder with `npx wrangler deploy`
# (docs/operations.md › Deploying).
#
# No IDs or keys here: every one is a secret, set with `npx wrangler secret put <NAME>`
# (docs/operations.md › Settings).
name = "suhina-bot"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# Names, not IDs: the repository the bot works on and the board new issues go on, in Backlog.
[vars]
GITHUB_REPOSITORY = "suhina-daw/suhina-daw"
BOARD_OWNER = "suhina-daw"
BOARD_NUMBER = "1"

# Everything the bot keeps: one strongly consistent Durable Object (src/state.rs).
[durable_objects]
bindings = [{ name = "STATE", class_name = "BotState" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotState"]

[observability]
enabled = true
