[package]
name = "suhina-bot-worker"
description = "The Suhina bot on Cloudflare Workers: routes, deferred answers, GitHub calls and the state Durable Object"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
suhina-bot-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reading a download chunk by chunk, to stop at the size limit.
futures-util = { version = "0.3", default-features = false }
# Reading the Durable Object's stored values when the alarm cleans up.
serde-wasm-bindgen = "0.6"
worker = "0.8.7"
# The Durable Object macro expands to code that names wasm-bindgen directly; same version as worker.
wasm-bindgen = "=0.2.129"
# WebCrypto signs the GitHub App JWT (RS256) natively, so no RSA code runs in WebAssembly.
web-sys = { version = "0.3", features = ["Blob", "Crypto", "CryptoKey", "FormData", "SubtleCrypto", "WorkerGlobalScope"] }

[lints]
workspace = true
